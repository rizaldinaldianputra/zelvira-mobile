services:
  mobile-web:
    image: ghcr.io/cirruslabs/flutter:stable
    container_name: zelvira-mobile-web
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "flutter pub get && flutter run -d web-server --web-port=8080 --web-hostname=0.0.0.0"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - BASE_URL=${BASE_URL:-https://api.zelvira.co.id}
      - STORAGE_URL=${STORAGE_URL:-https://s3.zelvira.co.id}
    networks:
      - zelvira-mobile-network

networks:
  zelvira-mobile-network:
    driver: bridge
    name: zelvira-mobile-network
